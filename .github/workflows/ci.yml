# ==========================================================
#  CI - code quality and tests
#  Runs the same checks as `make check` on every pull request
#  and on every push to main.
# ==========================================================
name: CI

on:
  pull_request:
  push:
    branches: [main]
    # The tag update pushed by the deploy job must not start a new pipeline:
    # it would publish the same code again and update the tag again, forever
    paths-ignore:
      - infra/k8s/overlays/local/kustomization.yaml

# Cancel the previous run when a new commit is pushed to the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the jobs only need to read the code
permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, security and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true          # reuse downloaded packages between runs

      - name: Install the locked environment
        run: make install-ci          # uv sync --frozen (Python from .python-version)

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Security scan
        run: make security

      - name: Tests
        run: make test                # data and model tests skip without data

  data-and-model:
    name: Data and model tests
    needs: quality                    # no need to download data if the code is broken
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Repository secrets are not shared with pull requests opened from forks
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install the locked environment
        run: make install-ci

      - name: Configure the DVC remote credentials
        env:                          # secrets go through env, never inline in the script
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          uv run dvc remote modify origin --local auth basic
          uv run dvc remote modify origin --local user "$DAGSHUB_USERNAME"
          uv run dvc remote modify origin --local password "$DAGSHUB_TOKEN"

      - name: Pull the data and the model
        run: make data-pull

      - name: Check the pipeline is up to date
        run: make pipeline-check      # dvc.lock must match the code, params and data

      - name: Tests (unit, data and model)
        run: make test                # nothing is skipped: the data and the model are here

      - name: Share the tested model and its training data with the image job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model
          path: |
            models/model.joblib
            data/processed/train.csv
          if-no-files-found: error
          retention-days: 1

  docker-image:
    name: Docker image
    needs: data-and-model             # build the image with the model that passed the tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write                 # publish the image to GitHub Container Registry
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute the image tag
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"   # same as docker-push

      - name: Download the tested model and its training data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: model
          path: .                     # models/model.joblib and data/processed/train.csv

      # Layer cache shared between runs: while uv.lock does not change, the
      # dependency layer keeps the same digest, so the cluster does not
      # download it again (about 117 MB) for each new version
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Expose the GitHub runtime to the build cache
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Build the image
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}   # the builder that can export a cache
          DOCKER_BUILD_FLAGS: >-
            --load
            --cache-from type=gha,scope=api
            --cache-to type=gha,scope=api,mode=max
        run: make docker-build DOCKER_BUILD_FLAGS="$DOCKER_BUILD_FLAGS"

      - name: Smoke test the image
        run: make docker-smoke        # /health, /predict, 422 on bad input, non-root user

      - name: Build the drift check image
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
          DOCKER_BUILD_FLAGS: >-
            --load
            --cache-from type=gha,scope=drift
            --cache-to type=gha,scope=drift,mode=max
        run: make docker-build-drift DOCKER_BUILD_FLAGS="$DOCKER_BUILD_FLAGS"

      - name: Smoke test the drift check image
        run: make docker-smoke-drift  # Evidently and the reference data load read-only

      # Only after a merge on main: pull requests build and test the image, never publish it
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

      - name: Publish the tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: make docker-push         # diabetes-api and diabetes-drift :<commit> and :latest

  deploy:
    name: Deploy (update the image tag in Git)
    needs: docker-image               # only once the image is tested and published
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Deployments run one after the other, never in parallel
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      # The deploy key is the only credential allowed to push to main (ruleset bypass)
      - name: Check out main with the deploy key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Set the new image tag in the local overlay
        env:
          TAG: ${{ needs.docker-image.outputs.image-tag }}
        run: make k8s-set-image TAG="$TAG"

      # Argo CD watches main: this commit is what deploys the new version
      - name: Commit and push the new tag
        env:
          TAG: ${{ needs.docker-image.outputs.image-tag }}
        run: |
          if git diff --quiet; then
            echo "Image $TAG is already the deployed version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: update api image to $TAG"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            echo "Push rejected (attempt $attempt): main moved, rebasing"
            git pull --rebase origin main
          done
          exit 1

  metrics-report:
    name: Metrics report
    needs: data-and-model             # metrics are trusted once dvc.lock is verified
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write            # post the report as a pull request comment
    steps:
      - name: Check out the code with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0              # dvc reads the metrics of the base branch from git

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install the locked environment
        run: make install-ci

      - name: Install CML
        uses: iterative/setup-cml@e5f9f4673e0a8f275c45cc66dbbfd29c8469fb4e # v2.1.0
        with:
          version: 0.20.6
          vega: false                 # no plots in the report

      - name: Build the report
        env:
          BASE: origin/${{ github.base_ref }}
        run: make report              # metrics and params diff against the base branch

      - name: Post the report on the pull request
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cml comment update --target=pr --watermark-title="Model report" reports/report.md
