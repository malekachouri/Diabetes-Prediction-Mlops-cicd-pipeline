# ==========================================================
#  CI - code quality and tests
#  Runs the same checks as `make check` on every pull request
#  and on every push to main.
# ==========================================================
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel the previous run when a new commit is pushed to the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the jobs only need to read the code
permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, security and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true          # reuse downloaded packages between runs

      - name: Install the locked environment
        run: make install-ci          # uv sync --frozen (Python from .python-version)

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Security scan
        run: make security

      - name: Tests
        run: make test                # data and model tests skip without data
