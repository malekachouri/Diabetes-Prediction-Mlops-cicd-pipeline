[project]
name = "diabetes-prediction-mlops"
version = "0.1.0"
description = "End-to-end MLOps CI/CD pipeline for diabetes prediction"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.148.0",
    "joblib>=1.6.0",
    "pandas>=2.3.3",
    "pydantic>=2.14.1",
    "scikit-learn>=1.7.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

# ==========================================================
#  RUFF: linter + formatter
# ==========================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",    # style errors (pycodestyle)
    "W",    # style warnings
    "F",    # logic errors: unused imports/variables (pyflakes)
    "I",    # import sorting (isort)
    "B",    # likely bugs (bugbear)
    "UP",   # modern Python syntax (pyupgrade)
    "SIM",  # code simplifications
    "N",    # PEP 8 naming conventions
    "C4",   # comprehensions
    "S",    # security (bandit rules)
    "PT",   # pytest best practices
]
ignore = [
    "N803", # allow uppercase arguments (X, X_train: ML convention)
    "N806", # allow uppercase variables (X, X_train: ML convention)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # assert is expected in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ==========================================================
#  PYTEST: tests
# ==========================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
]
markers = [
    "slow: slow tests (full training)",
    "integration: integration tests (API, external services)",
]

# ==========================================================
#  COVERAGE: code coverage
# ==========================================================
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 0          # will be raised to 80 in step 5
show_missing = true
skip_empty = true

# ==========================================================
#  MYPY: static type checking
# ==========================================================
[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true   # pandas/sklearn are not fully typed
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# Progressive strict mode: disallow_untyped_defs will be enabled later

# ==========================================================
#  BANDIT: code security
# ==========================================================
[tool.bandit]
exclude_dirs = ["tests", ".venv", "notebooks"]
