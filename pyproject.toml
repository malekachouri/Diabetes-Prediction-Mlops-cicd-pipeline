[project]
name = "diabetes-prediction-mlops"
version = "0.1.0"
description = "End-to-end MLOps CI/CD pipeline for diabetes prediction"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.148.0",
    "joblib>=1.6.0",
    "pandas>=2.3.3",
    "pydantic>=2.14.1",
    "scikit-learn>=1.7.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

# ==========================================================
#  RUFF : linter + formateur
# ==========================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",    # erreurs de style (pycodestyle)
    "W",    # avertissements de style
    "F",    # erreurs logiques : imports/variables inutilisés
    "I",    # tri des imports
    "B",    # bugs probables
    "UP",   # syntaxe Python moderne
    "SIM",  # simplifications de code
    "N",    # conventions de nommage PEP 8
    "C4",   # compréhensions de listes
    "S",    # sécurité
    "PT",   # bonnes pratiques pytest
]
ignore = [
    "N803", # autorise X, X_train en argument (convention ML)
    "N806", # autorise X, X_train en variable (convention ML)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # assert est normal dans les tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ==========================================================
#  PYTEST : tests
# ==========================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
]
markers = [
    "slow: tests lents (entraînement complet)",
    "integration: tests d'intégration (API, services externes)",
]

# ==========================================================
#  COVERAGE : couverture de code
# ==========================================================
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 0          # sera relevé à 80 à l'étape 5
show_missing = true
skip_empty = true

# ==========================================================
#  MYPY : vérification des types
# ==========================================================
[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# ==========================================================
#  BANDIT : sécurité du code
# ==========================================================
[tool.bandit]
exclude_dirs = ["tests", ".venv", "notebooks"]
