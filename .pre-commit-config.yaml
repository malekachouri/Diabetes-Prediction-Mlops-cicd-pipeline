# Install both pre-commit AND pre-push hooks with a single command
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # ---------- File hygiene ----------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace        # trailing spaces
      - id: end-of-file-fixer          # newline at end of every file
      - id: check-yaml                 # valid YAML (workflows, k8s)
        args: [--unsafe]
      - id: check-toml                 # valid pyproject.toml
      - id: check-json
      - id: check-added-large-files    # block files > 500 KB (datasets, models)
        args: [--maxkb=500]
      - id: check-merge-conflict       # leftover <<<<<<< markers
      - id: detect-private-key         # SSH/TLS private keys
      - id: mixed-line-ending          # enforce LF
        args: [--fix=lf]
      - id: no-commit-to-branch        # never commit directly on main
        args: [--branch, main]

  # ---------- Python lint + format ----------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1                       # keep in sync with ruff in uv.lock
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # ---------- Secrets ----------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # ---------- Local hooks (use the project's uv environment) ----------
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run pytest -q --no-cov
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]             # on push only: keeps commits fast
