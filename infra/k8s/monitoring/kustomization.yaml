# Grafana dashboards of the project: the Grafana sidecar loads every
# ConfigMap labelled grafana_dashboard=1 in the monitoring namespace
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  - name: diabetes-api-dashboard
    files:
      - dashboards/diabetes-api.json
