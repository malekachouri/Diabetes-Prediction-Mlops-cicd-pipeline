# Scheduled drift check: reads the predictions logged by the API pods,
# compares them with the training data and pushes the result to Prometheus
apiVersion: v1
kind: ServiceAccount
metadata:
  name: drift-monitor
---
# Least privilege: list the pods and read their logs, in this namespace only
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: drift-monitor
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: drift-monitor
subjects:
  - kind: ServiceAccount
    name: drift-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: drift-monitor
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: drift-monitor
  labels:
    app.kubernetes.io/name: drift-monitor
spec:
  schedule: "*/15 * * * *"             # every 15 minutes
  concurrencyPolicy: Forbid             # never two checks at the same time
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: drift-monitor
        spec:
          serviceAccountName: drift-monitor
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: drift
              # The tag is set by the overlay (kustomization.yaml "images")
              image: ghcr.io/malekachouri/diabetes-drift
              env:
                - name: PUSHGATEWAY_URL
                  value: http://prometheus-prometheus-pushgateway.monitoring.svc:9091
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                # On drift, an issue is opened in this repository
                - name: GITHUB_REPOSITORY
                  value: malekachouri/Diabetes-Prediction-Mlops-cicd-pipeline
                # Created by hand (make drift-github-token), never stored in Git;
                # without it the drift is only reported to Prometheus
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: drift-github-token
                      key: token
                      optional: true
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
