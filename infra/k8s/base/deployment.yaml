# Prediction API: pods running the image published by the CI
apiVersion: apps/v1
kind: Deployment
metadata:
  name: diabetes-api
  labels:
    app.kubernetes.io/name: diabetes-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: diabetes-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0                # never fewer ready pods than requested during an update
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: diabetes-api
      # Read by the "kubernetes-pods" job of Prometheus
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false   # the API never calls the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 999                 # the "app" user of the image
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # The tag is set by the overlay (kustomization.yaml "images")
          image: ghcr.io/malekachouri/diabetes-api
          ports:
            - name: http
              containerPort: 8000
          # Ready to receive traffic only once the model is loaded
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          # Restarted if it stops answering
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # Gives the model up to 60 s to load before the other probes start
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 192Mi            # measured: about 145 MiB after startup
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp                    # the only writable path (read-only root filesystem)
          emptyDir: {}
