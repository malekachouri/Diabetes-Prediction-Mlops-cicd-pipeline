# Monitoring stack, deployed by Argo CD in the "monitoring" namespace:
# Prometheus (metrics), Grafana (dashboards) and the project dashboards.
# Chart versions are pinned; Renovate or a manual PR updates them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.38.2
    helm:
      valuesObject:
        # Prometheus server + Pushgateway (receives the drift check results);
        # alerts are shown in the Prometheus UI, without Alertmanager for now
        alertmanager:
          enabled: false
        kube-state-metrics:
          enabled: false
        prometheus-node-exporter:
          enabled: false
        prometheus-pushgateway:
          enabled: true
        serverFiles:
          alerting_rules.yml:
            groups:
              - name: diabetes-model
                rules:
                  - alert: DiabetesDataDrift
                    expr: max(diabetes_drift_dataset_drift) == 1
                    labels:
                      severity: warning
                    annotations:
                      summary: Data drift on the production requests
                      description: At least half of the features no longer follow the training distribution; retraining may be needed.
                  - alert: DiabetesDriftCheckStale
                    expr: time() - max(diabetes_drift_last_run_timestamp_seconds) > 3600
                    labels:
                      severity: warning
                    annotations:
                      summary: The drift check has not run for more than one hour
                      description: Check the drift-monitor CronJob in the diabetes namespace.
        server:
          retention: 7d
          global:
            scrape_interval: 15s
          # Local cluster: metrics are lost when the pod restarts
          persistentVolume:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: 14.0.1
    helm:
      valuesObject:
        testFramework:
          enabled: false
        persistence:
          enabled: false
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                type: prometheus
                uid: prometheus
                url: http://prometheus-server.monitoring.svc
                access: proxy
                isDefault: true
        # Load every ConfigMap labelled grafana_dashboard=1 as a dashboard
        sidecar:
          dashboards:
            enabled: true
            label: grafana_dashboard
            labelValue: "1"
            searchNamespace: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-dashboards
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/malekachouri/Diabetes-Prediction-Mlops-cicd-pipeline.git
    targetRevision: main
    path: infra/k8s/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
